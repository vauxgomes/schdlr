  #     db:
  #       condition: service_healthy

  # Descomentado pela spec que criar o Dockerfile do web.
  # web:
  #   build: ./apps/web
  #   ports:
  #     - '3000:3000'
  #   depends_on:
  #     - api

volumes:
  db-data:
